# Coolify resource: OpenBao (production mode, raft storage). Starts sealed;
# the owner unseals it after every restart. Then run
# infra/openbao/setup-treasury.sh once with the owner's admin token.
services:
  openbao:
    image: openbao/openbao:2.7.1
    # The image's entrypoint turns "server" into
    # `bao server -config=/openbao/config`, which loads the mounted file below.
    # Don't add -config here: the file would be read twice.
    command: ["server"]
    restart: unless-stopped
    cap_add: [IPC_LOCK]
    volumes:
      - ../openbao/openbao.hcl:/openbao/config/openbao.hcl:ro
      # The entrypoint makes only /openbao/config, /openbao/file and
      # /openbao/logs writable for the openbao user before dropping root, so
      # raft storage and the audit log live there (see openbao.hcl).
      - openbao-data:/openbao/file
      - openbao-audit:/openbao/logs
      - ./tls/openbao:/openbao/tls:ro
    expose: ["8200"]
volumes:
  openbao-data: {}
  openbao-audit: {}
