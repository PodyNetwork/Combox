# Coolify resource: self-hosted Postiz. Check Postiz's own self-hosting docs
# for any extra companions required by the pinned version before deploying.
services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:v2.25.0
    restart: unless-stopped
    environment:
      MAIN_URL: ${POSTIZ_URL}
      FRONTEND_URL: ${POSTIZ_URL}
      NEXT_PUBLIC_BACKEND_URL: ${POSTIZ_URL}/api
      JWT_SECRET: ${POSTIZ_JWT_SECRET}
      DATABASE_URL: postgresql://postiz:${POSTIZ_DB_PASSWORD}@postiz-db:5432/postiz
      REDIS_URL: redis://postiz-redis:6379
      BACKEND_INTERNAL_URL: http://localhost:3000
      IS_GENERAL: "true"
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
    volumes: [postiz-uploads:/uploads, postiz-config:/config]
    depends_on: [postiz-db, postiz-redis]
    expose: ["5000"]
  postiz-db:
    image: postgres:16.14-bookworm
    restart: unless-stopped
    environment: { POSTGRES_USER: postiz, POSTGRES_PASSWORD: "${POSTIZ_DB_PASSWORD}", POSTGRES_DB: postiz }
    volumes: [postiz-pg:/var/lib/postgresql/data]
  postiz-redis:
    image: redis:7.4.10-alpine
    restart: unless-stopped
volumes:
  postiz-uploads: {}
  postiz-config: {}
  postiz-pg: {}
