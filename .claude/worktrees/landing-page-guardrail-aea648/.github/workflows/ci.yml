name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.14-bookworm
        env:
          POSTGRES_USER: axom
          POSTGRES_PASSWORD: axom
          POSTGRES_DB: axom
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U axom" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://axom:axom@localhost:5432/axom
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: axom
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clippy
        working-directory: axom
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (includes the end-to-end run against mocks)
        working-directory: axom
        run: cargo test --workspace

  meet-agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Interview logic tests
        working-directory: meet-agent
        run: |
          pip install pytest==9.2.0
          python -m pytest -q

  web:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        app: [admin, meet-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build ${{ matrix.app }}
        working-directory: ${{ matrix.app }}
        run: npm ci --no-audit --no-fund && npm run build
