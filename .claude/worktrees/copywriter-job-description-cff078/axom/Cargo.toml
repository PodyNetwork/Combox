[workspace]
resolver = "2"
members = [
    "crates/axom-core",
    "crates/axom-hr",
    "crates/axom-planner",
    "crates/axom-tools",
    "crates/axom-api",
    "crates/axom-signer",
    "crates/axom-platform",
    "crates/axom-bin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
bs58 = "0.5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
jsonwebtoken = "9"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
rust_decimal = { version = "1", features = ["serde-with-str"] }
rust_decimal_macros = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "json", "rust_decimal", "macros", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

axom-core = { path = "crates/axom-core" }
axom-hr = { path = "crates/axom-hr" }
axom-planner = { path = "crates/axom-planner" }
axom-tools = { path = "crates/axom-tools" }
axom-api = { path = "crates/axom-api" }
axom-signer = { path = "crates/axom-signer" }
axom-platform = { path = "crates/axom-platform" }
