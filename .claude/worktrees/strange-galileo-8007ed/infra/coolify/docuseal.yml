# Coolify resource: self-hosted DocuSeal. After first start, create the
# owner-approved templates (freelancer contract, termination notice, W-9,
# W-8BEN) and set DOCUSEAL_TEMPLATES=name=id,... for ForeMan.
services:
  docuseal:
    image: docuseal/docuseal:3.3.1
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://docuseal:${DOCUSEAL_DB_PASSWORD}@docuseal-db:5432/docuseal
      SECRET_KEY_BASE: ${DOCUSEAL_SECRET_KEY_BASE}
    volumes: [docuseal-data:/data]
    depends_on: [docuseal-db]
    expose: ["3000"]
  docuseal-db:
    image: postgres:16.14-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: docuseal
      POSTGRES_PASSWORD: ${DOCUSEAL_DB_PASSWORD}
      POSTGRES_DB: docuseal
    volumes: [docuseal-pg:/var/lib/postgresql/data]
volumes:
  docuseal-data: {}
  docuseal-pg: {}
