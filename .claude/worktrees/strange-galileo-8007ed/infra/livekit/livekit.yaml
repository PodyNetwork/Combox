# LiveKit server config (keys come from LIVEKIT_KEYS in the environment).
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
turn:
  enabled: true
  domain: turn.example.com      # set to your TURN domain
  tls_port: 5349
  udp_port: 3478
  cert_file: /etc/turn-tls/tls.crt
  key_file: /etc/turn-tls/tls.key
room:
  empty_timeout: 600
  max_participants: 10
logging:
  level: info
