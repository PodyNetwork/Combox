# Run ForeMan locally in Docker, with the settings in .env.
#
#   cp .env.example .env        # fill it in (see README, "Running the real stack")
#   docker compose up --build   # Postgres, API + scheduler, dashboard, jobs board,
#                               # LiveKit (video meetings) and the AI interviewer
#
# Payouts (NEAR testnet): the payouts profile adds OpenBao (holds the
# treasury key) and the signer. ./scripts/setup sets them up and
# ./scripts/start runs them; by hand:
#   COMPOSE_PROFILES=payouts AXOM_DOCKER_SIGNER_URL=http://axom-signer:8090 docker compose up --build
#
# Open: dashboard http://localhost:5174, jobs board http://localhost:5173/jobs,
# API http://localhost:8080/health. Stop with ./scripts/stop. `docker compose
# --profile payouts down -v` also DELETES the local database and OpenBao's
# data, including the treasury key.
#
# Multi-tenant platform (anyone can sign up companies): set in .env
#   AXOM_MULTI_TENANT=true
#   AXOM_DOCKER_DATABASE_URL=postgres://axom:axom@db:5432/axom_platform
# plus AXOM_SECRETS_KEY and AXOM_BILLING_ACCOUNT (see docs/SETUP.md).
#
# Inside containers "localhost" is the container itself: point OPENBAO_ADDR
# and similar at host.docker.internal (or a real host name). LiveKit is part
# of the stack: browsers reach it at ws://localhost:7880, the API and the
# interviewer at livekit:7880. The local keys below are for this machine only;
# set LIVEKIT_API_KEY / LIVEKIT_API_SECRET in .env for anything shared.
# For the VPS, use infra/coolify/ instead.

services:
  db:
    image: postgres:16.14-bookworm
    environment:
      POSTGRES_USER: axom
      POSTGRES_PASSWORD: axom
      POSTGRES_DB: axom
    volumes:
      - axom-db:/var/lib/postgresql/data
      # Creates the platform database (multi-tenant mode) on first start.
      - ./infra/docker/initdb.sql:/docker-entrypoint-initdb.d/10-axom-platform.sql:ro
    ports: ["127.0.0.1:55432:5432"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axom -d axom"]
      interval: 3s
      retries: 20

  axom:
    build: { context: ., dockerfile: axom/Dockerfile }
    env_file: [.env]
    environment:
      # The compose database unless AXOM_DOCKER_DATABASE_URL points elsewhere
      # (DATABASE_URL in .env usually says localhost, which is wrong in here).
      DATABASE_URL: ${AXOM_DOCKER_DATABASE_URL:-postgres://axom:axom@db:5432/axom}
      AXOM_API_BIND: 0.0.0.0:8080
      AXOM_POLICY_PATH: /app/config/policy.toml
      AXOM_PLANNER_CONFIG_PATH: /app/config/planner.toml
      AXOM_PERFORMANCE_CONFIG_PATH: /app/config/performance.toml
      AXOM_MASTER_PLAN_PATH: /app/config/master_plan.json
      # The dashboard asks the signer (payouts profile) for the treasury
      # address; without the signer it says the treasury isn't connected.
      # Not AXOM_SIGNER_URL from .env: that one is for scripts/dev.sh, and
      # its 127.0.0.1 would be this container, where no signer runs.
      AXOM_SIGNER_URL: ${AXOM_DOCKER_SIGNER_URL:-}
      # The bundled LiveKit server.
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      LIVEKIT_API_URL: http://livekit:7880
      # The meeting agent calls back from its own container, where localhost
      # is not this service.
      AXOM_AGENT_CALLBACK_URL: ${AXOM_DOCKER_AGENT_CALLBACK_URL:-http://axom:8080}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-axomlocal}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-axom-local-livekit-secret-change-me-0123}
      # .env holds the signer's OpenBao token; only the signer gets it.
      # (Platform mode reads OPENBAO_PROVISIONER_TOKEN from .env.)
      OPENBAO_TOKEN: ""
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8080:8080"]
    depends_on: { db: { condition: service_healthy }, livekit: { condition: service_started } }
    restart: unless-stopped

  # Video meetings and AI interviews. Development mode: one UDP port and no
  # TURN, fine for this machine. For a server, use infra/coolify/axom.yml.
  livekit:
    image: livekit/livekit-server:v1.13.10
    command: ["--bind", "0.0.0.0", "--node-ip", "127.0.0.1"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-axomlocal}: ${LIVEKIT_API_SECRET:-axom-local-livekit-secret-change-me-0123}"
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
        room:
          empty_timeout: 600
          max_participants: 10
    ports: ["127.0.0.1:7880:7880", "127.0.0.1:7881:7881", "127.0.0.1:7882:7882/udp"]
    restart: unless-stopped

  # Holds the treasury key; only the signer talks to it. Not published to the
  # host. Starts sealed: ./scripts/start unseals it.
  openbao:
    profiles: [payouts]
    image: openbao/openbao:2.7.1
    command: ["server"]
    volumes:
      - ./infra/openbao/local.hcl:/openbao/config/openbao.hcl:ro
      - openbao-data:/openbao/file
      - openbao-audit:/openbao/logs
    restart: unless-stopped

  axom-signer:
    profiles: [payouts]
    build: { context: ., dockerfile: axom/Dockerfile }
    command: ["axom-signer"]
    # Not the whole .env: the signer holds verify keys only. It never gets
    # the keys that sign authorizations, the secrets key, the Supabase JWT
    # secret or SMTP credentials. The names with no value below are passed
    # through from .env as they are (and stay unset when .env has none).
    environment:
      DATABASE_URL: ${AXOM_DOCKER_DATABASE_URL:-postgres://axom:axom@db:5432/axom}
      AXOM_SIGNER_BIND: 0.0.0.0:8090
      AXOM_POLICY_PATH: /app/config/policy.toml
      # The OpenBao above, unless AXOM_DOCKER_OPENBAO_ADDR points elsewhere.
      OPENBAO_ADDR: ${AXOM_DOCKER_OPENBAO_ADDR:-http://openbao:8200}
      # The signer's own token, from .env (written by ./scripts/setup), never
      # from a file. The API's provisioner token is not passed in here.
      OPENBAO_TOKEN:
      OPENBAO_TRANSIT_KEY:
      AXOM_LIVE:
      AXOM_MULTI_TENANT:
      NEAR_NETWORK:
      NEAR_RPC_URL:
      # Cross-chain payouts (NEAR Intents); the signer picks its client from these.
      AXOM_INTENTS:
      AXOM_INTENTS_API_URL:
      AXOM_INTENTS_API_KEY:
      AXOM_ATTESTATION_VERIFY_KEY:
      AXOM_APPROVAL_VERIFY_KEY:
      # The same limits the API applies; without them the signer would
      # re-check payouts against different numbers.
      PAYOUT_APPROVAL_THRESHOLD_USD:
      MONTHLY_PAYOUT_CAP_USD:
      # Platform default for treasury yield (each company can turn it on or
      # off in Settings); the API reads the same value from .env.
      TREASURY_YIELD_ENABLED:
      AXOM_OWNER_EMAIL:
      AXOM_DASHBOARD_URL:
      RUST_LOG:
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: { db: { condition: service_healthy }, openbao: { condition: service_started } }
    restart: unless-stopped

  # The AI interviewer. Its speech and Claude keys come from each company's
  # Integrations page (or DEEPGRAM_API_KEY / CARTESIA_API_KEY /
  # ANTHROPIC_API_KEY in .env); it starts without them.
  meet-agent:
    build: { context: meet-agent }
    # Not the whole .env: this service talks to candidates, so it gets only
    # its own keys (passed through from .env when set there).
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-axomlocal}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-axom-local-livekit-secret-change-me-0123}
      DEEPGRAM_API_KEY:
      CARTESIA_API_KEY:
      ANTHROPIC_API_KEY:
      AXOM_MEET_LLM_MODEL:
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: { livekit: { condition: service_started } }
    restart: unless-stopped

  admin:
    build:
      context: admin
      dockerfile: ../infra/web.Dockerfile
      args:
        VITE_AXOM_API_URL: ${VITE_AXOM_API_URL:-http://localhost:8080}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_AXOM_MEET_WEB_URL: ${VITE_AXOM_MEET_WEB_URL:-http://localhost:5173}
        # Parent domain shared with the website in production (e.g. example.com).
        VITE_SESSION_COOKIE_DOMAIN: ${VITE_SESSION_COOKIE_DOMAIN:-}
    ports: ["127.0.0.1:5174:80"]
    restart: unless-stopped

  meet-web:
    build:
      context: meet-web
      dockerfile: ../infra/web.Dockerfile
      args:
        VITE_AXOM_API_URL: ${VITE_AXOM_API_URL:-http://localhost:8080}
    ports: ["127.0.0.1:5173:80"]
    restart: unless-stopped

  # The public website. ./scripts/setup opens it first; its Sign in leads to the
  # dashboard, and signed-in visitors are sent straight there.
  site:
    build:
      context: site
      dockerfile: ../infra/site.Dockerfile
      args:
        VITE_DASHBOARD_URL: ${VITE_DASHBOARD_URL:-http://localhost:5174}
        VITE_JOBS_URL: ${VITE_JOBS_URL:-http://localhost:5173/jobs}
        VITE_BRIEFS_URL: ${VITE_BRIEFS_URL:-http://localhost:5173/briefs}
    ports: ["127.0.0.1:5175:80"]
    restart: unless-stopped

volumes:
  openbao-data:
  openbao-audit:
  axom-db:
