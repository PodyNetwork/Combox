# Rule-based planner config (versioned). The planner maps each plan objective
# to a department template, builds the org chart from the templates it uses,
# and creates one first task per objective.
version = "2026-11-08.1"
fallback_department = "Operations"

# Tools ForeMan knows about. Roles and tasks may reference only these.
known_tools = ["code_repo", "web_research", "postiz", "warmbly", "crm", "docuseal", "smtp", "upwork", "task_intake"]

[[departments]]
name = "Engineering"
keywords = ["build", "develop", "mvp", "api", "code", "product", "deploy", "infrastructure", "app", "feature", "backend", "frontend"]
task_tools = ["code_repo"]
task_skills = ["software_engineering"]
  [[departments.teams]]
  name = "Product Engineering"
    [[departments.teams.roles]]
    title = "Software Engineer Agent"
    kind = "ai_agent"
    skills = ["software_engineering", "testing"]
    tools = ["code_repo", "web_research"]
    pay_rate_usd = "2"
    pay_unit = "task"
    headcount = 2
    kpis = [{ name = "completion_rate", target = 0.9 }, { name = "on_time_rate", target = 0.85 }]

[[departments]]
name = "Marketing"
keywords = ["marketing", "launch", "social", "content", "brand", "audience", "campaign", "blog", "seo", "announce"]
task_tools = ["postiz"]
task_skills = ["copywriting"]
  [[departments.teams]]
  name = "Growth"
    [[departments.teams.roles]]
    title = "Content Marketer Agent"
    kind = "ai_agent"
    skills = ["copywriting", "social_media"]
    tools = ["postiz", "web_research"]
    pay_rate_usd = "1.5"
    pay_unit = "task"
    headcount = 1
    kpis = [{ name = "completion_rate", target = 0.9 }]

[[departments]]
name = "Sales"
keywords = ["sales", "customers", "leads", "outreach", "pipeline", "revenue", "pricing", "deals"]
task_tools = ["warmbly", "crm"]
task_skills = ["sales_outreach"]
  [[departments.teams]]
  name = "Outbound"
    [[departments.teams.roles]]
    title = "Sales Development Agent"
    kind = "ai_agent"
    skills = ["sales_outreach"]
    tools = ["warmbly", "crm"]
    pay_rate_usd = "1.5"
    pay_unit = "task"
    headcount = 1
    kpis = [{ name = "completion_rate", target = 0.9 }]

[[departments]]
name = "Design"
keywords = ["design", "logo", "ui", "ux", "visual", "mockup", "illustration"]
task_tools = []
task_skills = ["visual_design"]
  [[departments.teams]]
  name = "Brand Design"
    # Human roles are not instantiated at boot: routing opens a hiring request
    # and hiring (milestone 8) fills it through Upwork.
    [[departments.teams.roles]]
    title = "Brand Designer"
    kind = "human_freelancer"
    skills = ["visual_design"]
    tools = []
    pay_rate_usd = "25"
    pay_unit = "task"
    headcount = 1
    kpis = [{ name = "on_time_rate", target = 0.9 }]

[[departments]]
name = "Operations"
keywords = ["legal", "contract", "hire", "hiring", "support", "operations", "finance", "compliance"]
task_tools = ["docuseal"]
task_skills = ["operations"]
  [[departments.teams]]
  name = "Back Office"
    [[departments.teams.roles]]
    title = "Operations Agent"
    kind = "ai_agent"
    skills = ["operations"]
    tools = ["docuseal", "smtp"]
    pay_rate_usd = "1"
    pay_unit = "task"
    headcount = 1
    kpis = [{ name = "completion_rate", target = 0.9 }]
